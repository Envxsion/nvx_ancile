name: Nightly evals

on:
  schedule:
    - cron: '0 17 * * *' # 03:00 Melbourne
  workflow_dispatch:

jobs:
  evals:
    name: Retrieval and fact-check evals
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env: { POSTGRES_USER: ancile, POSTGRES_PASSWORD: ancile, POSTGRES_DB: ancile }
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U ancile" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://ancile:ancile@localhost:5433/ancile
      # Fact-check evals need a real verifier model; set as repository secrets.
      ANTHROPIC_API_KEY: ${{ secrets.EVAL_ANTHROPIC_API_KEY }}
      OPENAI_API_KEY: ${{ secrets.EVAL_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true, python-version: '3.12' }
      - run: uv sync --project services/knowledge --frozen
      - run: psql postgres://ancile:ancile@localhost:5433/ancile -f infra/db/init.sql
      # The real local embedder (downloaded once into the cache) against the
      # floors for it in tests/eval/retrieval/thresholds.json. CI runs the same
      # suite on every push with the offline hash embedder (ci.yml, evals).
      - run: uv sync --project services/knowledge --frozen --extra embed
      - name: Retrieval eval
        run: uv run --project services/knowledge python tests/eval/retrieval/run.py --download --prepare --report tests/eval/retrieval/report.json
      # TODO(phase-6): the fact-check eval against a real verifier model
      # (services/core eval:factcheck with the registry pointed at it), using
      # the EVAL_* keys above; CI already gates the offline verifier.
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-reports, path: tests/eval/**/report*.json, if-no-files-found: ignore }
