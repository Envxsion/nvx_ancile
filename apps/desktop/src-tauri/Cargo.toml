# ------------------------------------------------------------------
#  NVX Ancile desktop app (Tauri v2 shell)
#  The native host: it runs every service (embedded Postgres, Core,
#  Knowledge, and the lab and Controller when bundled), keeps their
#  secrets in the OS keychain, and shows the Cockpit that Core serves.
#  Its own workspace, like the family's other Tauri apps, so a plain
#  `pnpm i` never pulls the Tauri toolchain.
# ------------------------------------------------------------------
[package]
name = "ancile-desktop"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["nvx.sh"]
description = "NVX Ancile: your self-hosted AI workspace, as a desktop app."
repository = "https://github.com/Envxsion/nvx_ancile"
rust-version = "1.88"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-updater = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
simplelog = "0.12"
# Secrets live in the OS keychain (Windows Credential Manager, macOS
# Keychain, the Secret Service on Linux), never in a file.
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
rand = "0.8"
base64 = "0.22"
# Plain-HTTP readiness probes to 127.0.0.1; no TLS stack needed.
ureq = { version = "2", default-features = false }
# Opens web and mail links from the Cockpit in the system browser, called
# from Rust only (links.rs): the Cockpit gets none of its commands.
tauri-plugin-opener = "2"
# Native dialogs for the first-close question and the quit check, called from
# Rust only: the Cockpit gets none of their commands.
tauri-plugin-dialog = "2"
# Tonight's update time in the local zone (the offset only; no calendar maths).
time = { version = "0.3", features = ["local-offset"] }

[target.'cfg(not(windows))'.dependencies]
# Native notifications (desktop.rs). Windows has its own with buttons that
# can be clicked, below.
tauri-plugin-notification = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# Notification buttons over D-Bus (notify.rs). MIT or Apache-2.0, and already
# built by the notification plugin, so the lock file gains no new crate.
notify-rust = "4.11"

[target.'cfg(windows)'.dependencies]
# A job object that kills every sidecar (and its children) with the app.
win32job = "2"
# Native toasts whose click and buttons reach us (notify.rs), and "is the
# computer shutting down" so closing the window never blocks a shutdown.
tauri-winrt-notification = "0.7"
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
# Release builds turn this on; the update key comes from CI, never the repo.
updater = ["dep:tauri-plugin-updater"]

[profile.release]
lto = "thin"
strip = true

[workspace]
