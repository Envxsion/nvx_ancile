<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Family app-icon formula (nvx_session icon-128.svg): 96px squircle,
       graphite ground, top-lit edge, a soft signal glow, the mark in a
       three-stop signal gradient with a blurred twin for bloom. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1d20"/><stop offset="1" stop-color="#08090a"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/></linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#cdc1ff"/><stop offset="0.55" stop-color="#9d86ff"/><stop offset="1" stop-color="#7a63e6"/></linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#9d86ff" stop-opacity="0.22"/><stop offset="1" stop-color="#9d86ff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.2"/></filter>
    <g id="mark" fill="none" stroke="url(#ink)" stroke-width="2" stroke-linecap="round">
      <path d="M14.4 3.4 C8.6 3.6 4.8 6.8 4.8 10.8 C4.8 14 9.8 14.4 9.8 17 C9.8 19.6 4.8 20 4.8 23.2 C4.8 27.2 8.6 30.4 14.4 30.6"/>
      <path opacity="0.7" d="M19.6 3.4 C25.4 3.6 29.2 6.8 29.2 10.8 C29.2 14 24.2 14.4 24.2 17 C24.2 19.6 29.2 20 29.2 23.2 C29.2 27.2 25.4 30.4 19.6 30.6"/>
      <path opacity="0.4" d="M17 12.6 A4.4 4.4 0 1 1 13.2 19.2"/>
      <circle cx="17" cy="17" r="1.5" fill="url(#ink)" stroke="none"/>
    </g>
  </defs>
  <rect x="16" y="16" width="96" height="96" rx="24" fill="url(#ground)"/>
  <circle cx="64" cy="64" r="40" fill="url(#glow)"/>
  <rect x="16.5" y="16.5" width="95" height="95" rx="23.5" fill="none" stroke="url(#edge)"/>
  <g transform="translate(64 64) scale(1.95) translate(-17 -17)">
    <use href="#mark" filter="url(#soft)" opacity="0.55"/>
    <use href="#mark"/>
  </g>
</svg>
