# =============================================================================
#  Local models: the recommended list behind Admin → Models → Download a
#  local model (docs/models.md#download-a-local-model).
#  Schema: packages/contracts/src/localmodels.ts → LocalModelsFile
#  Optional: without this file the download list is empty.
#
#  Sizes are the download as the publisher lists it, rounded up. ram_gb is
#  what the model needs to run on the processor alone (weights plus room for
#  a working context); vram_gb is what it needs to run fully on a graphics
#  card. Both are deliberately on the generous side: a model that only just
#  fits is slow. via: ollama is fetched with Ollama's own pull; via:
#  fastembed is the search embedder, fetched by the Knowledge service.
#  quant_tags lists the same model at other precisions (Ollama tags); the
#  download dialog offers them with size and memory estimates from params_b.
# =============================================================================
version: 1
