  # A model served by your own GPU node through the Controller. provider_model
  # is the Controller route alias.
  - id: controller/qwen3-72b
    provider: controller
    provider_model: qwen3-72b
    display_name: Qwen3 72B (your node)
    via: controller
    family: qwen
    context_window: 131072
    max_output: 16384
    capabilities: [tools, json]
    price: { input_per_mtok: 0, output_per_mtok: 0 }   # billed by the hour on the node; see Compute
    enabled: false

  # Ollama on this computer (OLLAMA_BASE_URL, else http://localhost:11434).
  # Listed, and routed to, only once Ollama has it pulled; until then it shows
  # as Not pulled in Admin → Models. Other pulled chat models are found by
  # themselves as ollama/<name>. Any OpenAI-compatible endpoint works too: set
  # provider: openai-compatible and its base_url.
  - id: ollama/qwen3-14b
    provider: ollama
    provider_model: "qwen3:14b"
    display_name: Qwen3 14B (Ollama)
    via: direct
    family: qwen
    context_window: 40960
    max_output: 8192
    capabilities: [tools, json]
    enabled: true

