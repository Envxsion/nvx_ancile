# =============================================================================
#  Models available to NVX Ancile.
#  Schema: packages/contracts/src/config.ts → ModelsFile
#  The onboarding wizard and Settings → Models write this file. Editing by
#  hand is fine; boot tests validate it and name the exact key that is wrong.
#
#  THE LINEUP (MD2). Every provider ships each of its lines (a tier family such as
#  Claude Opus, GPT Sol or Gemini Flash) with its CURRENT model and the generation
#  BEFORE it. A saved key switches both on (a line that has only a preview, such as
#  Gemini Pro, gets the preview); the picker shows the current one and folds the
#  older one under "Older". Anything else a provider offers waits behind "Add more
#  models". Where a provider has no earlier generation (GPT Astra, Gemini Argon, the
#  DeepSeek and Mistral aliases), the line ships one model; none is invented.
#  Every id, limit and price below was read on the provider's own page on 2026-10-20;
#  the page is named in the comment above each provider. Prices are USD per million
#  tokens at the provider's list; live checks overlay them (docs/models.md).
# =============================================================================
version: 1                       # file format version; always 1 for now
prices_as_of: 2026-10-20         # when the prices below were last checked by hand; live checks overlay them (docs/models.md)

models:
  # ---------------------------------------------------------------------------
  #  Anthropic. Ids, limits, thinking: platform.claude.com/docs/en/about-claude/models/overview and
  #  each model's page (/docs/en/models/<name>/overview); prices: platform.claude.com/docs/en/about-claude/pricing;
  #  checked 2026-10-20. Lines: Fable (5.1, 5), Opus (5.5, 5), Sonnet (5.5, 5), Haiku (5.5, 4.5; there is no Haiku 5).
  #  Claude Mythos is offered only to verified security organisations, so it is not listed.
  #  cache_write is the 5-minute rate. Haiku 5.5 is priced for prompts up to 100,000 tokens (a longer prompt is
  #  $0.50 in, $2.50 out; that tier is not modelled).
  # ---------------------------------------------------------------------------
  - id: anthropic/claude-fable-5-1
    provider: anthropic                    # which Gateway adapter is used
    provider_model: claude-fable-5-1       # the id the provider's API expects
    display_name: Claude Fable 5.1         # shown in the model switcher
    via: direct                            # direct = call the provider; controller = through the Controller
    family: anthropic                      # fact-check verifiers prefer a different family
    context_window: 1000000                # tokens; drives the context budget meter
    max_output: 128000                     # tokens reserved for the reply
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 10.0, output_per_mtok: 50.0, cached_per_mtok: 0.25, cache_write_per_mtok: 12.5 }  # USD per million tokens
    enabled: true                          # disabled models stay configured but are never routed to
    secret: ANTHROPIC_API_KEY              # name of the secret in the encrypted store

  - id: anthropic/claude-fable-5
    provider: anthropic
    provider_model: claude-fable-5
