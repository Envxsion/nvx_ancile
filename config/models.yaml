  - id: minimax/minimax-m3
    provider: minimax
    provider_model: MiniMax-M3
    display_name: MiniMax M3
    via: direct
    family: minimax
    context_window: 1000000
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.30, output_per_mtok: 1.20, cached_per_mtok: 0.06 }
    enabled: false
    secret: MINIMAX_API_KEY

  - id: minimax/minimax-m2.7
    provider: minimax
    provider_model: MiniMax-M2.7
    display_name: MiniMax M2.7
    via: direct
    family: minimax
    context_window: 204800
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.30, output_per_mtok: 1.20, cached_per_mtok: 0.06, cache_write_per_mtok: 0.375 }
    enabled: false
    secret: MINIMAX_API_KEY

  - id: minimax/minimax-m2.7-highspeed
    provider: minimax
    provider_model: MiniMax-M2.7-highspeed
    display_name: MiniMax M2.7 Highspeed
    via: direct
    family: minimax
    context_window: 204800
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.60, output_per_mtok: 2.40, cached_per_mtok: 0.06, cache_write_per_mtok: 0.375 }
    enabled: false
    secret: MINIMAX_API_KEY

  # Qwen (Alibaba Model Studio), international (Singapore) USD prices, for the
  # stable aliases qwen-max, qwen-plus and qwen-flash. Newer numbered models exist
  # (qwen3.8-max, qwen3.7-plus, qwen3.8-flash) with UNCONFIRMED prices; add them from
  # Settings -> Models once priced. Plus and Flash are priced in length tiers; the
  # first tier is shown (Plus up to 256K prompt, Flash up to 32K). Cached figures are 20%
  # of input, the implicit-cache hit rate in the docs ("varies by model"): UNCONFIRMED.
  # A key only works in the region it was made in (saved region: singapore, beijing, us).
  - id: qwen/qwen-max
    provider: qwen
    provider_model: qwen-max
    display_name: Qwen Max
    via: direct
    family: qwen
    context_window: 262144                 # UNCONFIRMED
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, json]
    price: { input_per_mtok: 2.0, output_per_mtok: 6.0, cached_per_mtok: 0.40 }
    enabled: false
    secret: DASHSCOPE_API_KEY

  - id: qwen/qwen-plus
    provider: qwen
    provider_model: qwen-plus
    display_name: Qwen Plus
    via: direct
    family: qwen
    context_window: 1000000
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.40, output_per_mtok: 1.60, cached_per_mtok: 0.08 }
