# =============================================================================
#  Models available to NVX Ancile.
#  Schema: packages/contracts/src/config.ts → ModelsFile
#  The onboarding wizard and Settings → Models write this file. Editing by
#  hand is fine; boot tests validate it and name the exact key that is wrong.
# =============================================================================
version: 1                       # file format version; always 1 for now
prices_as_of: 2026-10-19         # when the prices below were last checked by hand; live checks overlay them (docs/models.md)

models:
  - id: anthropic/claude-sonnet-5-5        # provider/model, unique; referenced by routing.yaml
    provider: anthropic                    # which Gateway adapter is used
    provider_model: claude-sonnet-5-5      # the id the provider's API expects
    display_name: Claude Sonnet 5.5        # shown in the model switcher
    via: direct                            # direct = call the provider; controller = through the Controller
    family: anthropic                      # fact-check verifiers prefer a different family
    context_window: 200000                 # tokens; drives the context budget meter
    max_output: 64000                      # tokens reserved for the reply
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 2.0, output_per_mtok: 10.0, cached_per_mtok: 0.2, cache_write_per_mtok: 2.5 }  # USD per million tokens
    enabled: true                          # disabled models stay configured but are never routed to
    secret: ANTHROPIC_API_KEY              # name of the secret in the encrypted store

  - id: anthropic/claude-opus-5-5
    provider: anthropic
    provider_model: claude-opus-5-5
    display_name: Claude Opus 5.5
    via: direct
    family: anthropic
    context_window: 200000
    max_output: 64000
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 4.0, output_per_mtok: 20.0, cached_per_mtok: 0.2, cache_write_per_mtok: 5.0 }
    enabled: true
    secret: ANTHROPIC_API_KEY

  - id: anthropic/claude-haiku-4-5
    provider: anthropic
    provider_model: claude-haiku-4-5-20251001
    display_name: Claude Haiku 4.5
    via: direct
    family: anthropic
    context_window: 200000
    max_output: 64000
    capabilities: [tools, vision, json]
    price: { input_per_mtok: 1.0, output_per_mtok: 5.0, cached_per_mtok: 0.1, cache_write_per_mtok: 1.25 }
    enabled: true
    secret: ANTHROPIC_API_KEY

  - id: openai/gpt-5.5
    provider: openai
    provider_model: gpt-5.5
    display_name: GPT-5.5
    via: direct
    family: openai
    context_window: 400000
    max_output: 128000
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 1.25, output_per_mtok: 10.0 }
    enabled: false                         # enabled by onboarding once a key passes its test
    secret: OPENAI_API_KEY

  - id: google/gemini-3-pro
    provider: google
    provider_model: gemini-3.1-pro-preview   # ai.google.dev/gemini-api/docs/models/gemini-3.1-pro-preview, checked 2026-10-20. "gemini-3-pro" is not offered (404)
    display_name: Gemini 3.1 Pro (preview)
    via: direct
    family: google
    context_window: 1000000
    max_output: 65536
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 1.25, output_per_mtok: 10.0 }
    enabled: false
    secret: GOOGLE_GENERATIVE_AI_API_KEY

  # ---------------------------------------------------------------------------
  #  Key-billed providers added in PV1. No base_url: the address comes from the
  #  provider's profile (services/core/src/gateway/profiles.ts) and the region
  #  saved beside its key, so a China or international key just works. Switched
  #  on when a key passes its test. Prices are USD per million tokens at the
  #  provider's own list, checked 16-19 Oct 2026. Ids and figures marked
  #  UNCONFIRMED were not on the provider's own pages; the daily model check
  #  (MD5) overlays OpenRouter's public prices where it can, and a wrong id
  #  shows up on the first test call. max_output values are working limits, not
  #  the provider's published maximum, unless the comment says so.
  # ---------------------------------------------------------------------------

  # DeepSeek. Half price off peak: peak is 01:00-04:00 and 06:00-10:00 UTC on
  # Monday to Friday, so off-peak is every other hour, plus all of Saturday and
  # Sunday (the windows below, UTC). price is the peak rate. Chinese public
  # holidays are also off-peak; they are not modelled, so those days cost less than shown.
  - id: deepseek/deepseek-v4-pro
    provider: deepseek
    provider_model: deepseek-v4-pro
    display_name: DeepSeek V4 Pro
    via: direct
    family: deepseek
    context_window: 1000000
    max_output: 384000
    capabilities: [tools, reasoning, json]
    price:
      input_per_mtok: 1.32
      output_per_mtok: 3.96
      cached_per_mtok: 0.044
      off_peak:
        input_per_mtok: 0.66
        output_per_mtok: 1.98
        cached_per_mtok: 0.022
        windows: &deepseek_off_peak
          - { days: [mon, tue, wed, thu, fri], from: "00:00", to: "01:00" }
          - { days: [mon, tue, wed, thu, fri], from: "04:00", to: "06:00" }
          - { days: [mon, tue, wed, thu, fri], from: "10:00", to: "24:00" }
          - { days: [sat, sun], from: "00:00", to: "24:00" }
    enabled: false
    secret: DEEPSEEK_API_KEY

  - id: deepseek/deepseek-flash
    provider: deepseek
    provider_model: deepseek-flash
    display_name: DeepSeek V4.1 Flash
    via: direct
    family: deepseek
    context_window: 1000000
    max_output: 384000
    capabilities: [tools, reasoning, json]
    price:
      input_per_mtok: 0.30
      output_per_mtok: 1.20
      cached_per_mtok: 0.006
      off_peak:
        input_per_mtok: 0.15
        output_per_mtok: 0.60
        cached_per_mtok: 0.003
        windows: *deepseek_off_peak
    enabled: false
    secret: DEEPSEEK_API_KEY

  # Moonshot (Kimi). Global and China keys are not interchangeable: the region saved
  # beside the key picks api.moonshot.ai or api.moonshot.cn. Kimi K2 models have no
  # cache write fee; K3 bills writes (shown at the 5-minute rate; 1 hour is $6).
  # Not listed: kimi-k2.7-code-highspeed ($1.90 in, $0.38 cached, $8 out).
  - id: moonshot/kimi-k3
    provider: moonshot
    provider_model: kimi-k3
    display_name: Kimi K3
    via: direct
    family: moonshot
    context_window: 1048576
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 3.0, output_per_mtok: 15.0, cached_per_mtok: 0.30, cache_write_per_mtok: 3.0 }
    enabled: false
    secret: MOONSHOT_API_KEY

  - id: moonshot/kimi-k2.6
    provider: moonshot
    provider_model: kimi-k2.6
    display_name: Kimi K2.6
    via: direct
    family: moonshot
    context_window: 262144
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.95, output_per_mtok: 4.0, cached_per_mtok: 0.16 }
    enabled: false
    secret: MOONSHOT_API_KEY

  - id: moonshot/kimi-k2.7-code
    provider: moonshot
    provider_model: kimi-k2.7-code
    display_name: Kimi K2.7 Code
    via: direct
    family: moonshot
    context_window: 262144
    max_output: 32768                      # UNCONFIRMED: working limit
    capabilities: [tools, reasoning, json]
    price: { input_per_mtok: 0.95, output_per_mtok: 4.0, cached_per_mtok: 0.19 }
    enabled: false
    secret: MOONSHOT_API_KEY

  # MiniMax. Global and China accounts are separate (saved region). M3 prices are
