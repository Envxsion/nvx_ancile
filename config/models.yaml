# =============================================================================
#  Models available to NVX Ancile.
#  Schema: packages/contracts/src/config.ts → ModelsFile
#  The onboarding wizard and Settings → Models write this file. Editing by
#  hand is fine; boot tests validate it and name the exact key that is wrong.
# =============================================================================
version: 1                       # file format version; always 1 for now

models:
  - id: anthropic/claude-sonnet-5-5        # provider/model, unique; referenced by routing.yaml
    provider: anthropic                    # which Gateway adapter is used
    provider_model: claude-sonnet-5-5      # the id the provider's API expects
    display_name: Claude Sonnet 5.5        # shown in the model switcher
    via: direct                            # direct = call the provider; controller = through the Controller
    family: anthropic                      # fact-check verifiers prefer a different family
    context_window: 200000                 # tokens; drives the context budget meter
    max_output: 64000                      # tokens reserved for the reply
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 3.0, output_per_mtok: 15.0, cached_per_mtok: 0.3 }  # USD per million tokens
    enabled: true                          # disabled models stay configured but are never routed to
    secret: ANTHROPIC_API_KEY              # name of the secret in the encrypted store

  - id: anthropic/claude-opus-5-5
    provider: anthropic
    provider_model: claude-opus-5-5
    display_name: Claude Opus 5.5
    via: direct
    family: anthropic
    context_window: 200000
    max_output: 64000
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 15.0, output_per_mtok: 75.0, cached_per_mtok: 1.5 }
    enabled: true
    secret: ANTHROPIC_API_KEY

  - id: anthropic/claude-haiku-4-5
    provider: anthropic
    provider_model: claude-haiku-4-5-20251001
    display_name: Claude Haiku 4.5
    via: direct
    family: anthropic
    context_window: 200000
    max_output: 64000
    capabilities: [tools, vision, json]
    price: { input_per_mtok: 1.0, output_per_mtok: 5.0, cached_per_mtok: 0.1 }
    enabled: true
    secret: ANTHROPIC_API_KEY

  - id: openai/gpt-5.5
    provider: openai
    provider_model: gpt-5.5
    display_name: GPT-5.5
    via: direct
    family: openai
    context_window: 400000
    max_output: 128000
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 1.25, output_per_mtok: 10.0 }
    enabled: false                         # enabled by onboarding once a key passes its test
    secret: OPENAI_API_KEY

  - id: google/gemini-3-pro
    provider: google
    provider_model: gemini-3-pro
    display_name: Gemini 3 Pro
    via: direct
    family: google
    context_window: 1000000
    max_output: 65536
    capabilities: [tools, vision, reasoning, json]
    price: { input_per_mtok: 1.25, output_per_mtok: 10.0 }
    enabled: false
    secret: GOOGLE_GENERATIVE_AI_API_KEY

  # A model served by your own GPU node through the Controller. provider_model
  # is the Controller route alias.
  - id: controller/qwen3-72b
    provider: controller
    provider_model: qwen3-72b
    display_name: Qwen3 72B (your node)
    via: controller
    family: qwen
    context_window: 131072
    max_output: 16384
    capabilities: [tools, json]
    price: { input_per_mtok: 0, output_per_mtok: 0 }   # billed by the hour on the node; see Compute
    enabled: false

  # Any OpenAI-compatible endpoint works by setting base_url.
  - id: ollama/qwen3-14b
    provider: openai-compatible
    provider_model: "qwen3:14b"
    display_name: Qwen3 14B (Ollama)
    via: direct
    family: qwen
    context_window: 40960
    max_output: 8192
    capabilities: [tools, json]
    base_url: http://localhost:11434/v1
    enabled: false                         # auto-enabled when onboarding detects Ollama

  - id: local/bge-small-en-v1.5
    provider: local
    provider_model: BAAI/bge-small-en-v1.5
    display_name: BGE small (local embeddings)
    via: direct
    family: bge
    context_window: 512
    max_output: 1
    capabilities: [embeddings]
    enabled: true

  - id: local/bge-reranker-v2-m3
    provider: local
    provider_model: BAAI/bge-reranker-v2-m3
    display_name: BGE reranker v2 m3 (local)
    via: direct
    family: bge
    context_window: 8192
    max_output: 1
    capabilities: [rerank]
    enabled: true
