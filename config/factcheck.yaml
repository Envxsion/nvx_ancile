# =============================================================================
#  Fact-checking and confidence (DESIGN.md §10).
#  Schema: packages/contracts/src/config.ts → FactcheckFile
#  confidence = support·w.support + agreement·w.agreement + retrieval·w.retrieval
#  The weights should sum to 1.
# =============================================================================
version: 1
weights:
  support: 0.5          # how strongly your sources back the claim
  agreement: 0.3        # whether an independent verifier agrees with the generator
  retrieval: 0.2        # how good the evidence that was found is
thresholds:
  contradict: 0.6       # contradicting evidence above this marks a claim contradicted
  verified: 0.6         # source support at or above this (and the verifier agreeing) verifies a claim;
                        # one passage that states it outright (score ~0.95) is enough
web_search: false       # look claims up on the web in every notebook (needs SEARXNG_URL). Off by default; a notebook turns it on with "Check on the web"
web_daily_cap_usd: 0.25 # most web lookups through a model may cost in a day (USD). SearXNG is free and not counted. 0: no model lookups
limits:                 # hard limits on one fact-check. A claim that hits one reads "Not checked: <reason>"
  calls_per_claim: 3    # model calls for one claim: the check, a stronger second look, a repair of a bad reply
  calls_per_check: 20   # model calls for the whole answer, finding the claims included
  minutes: 6            # how long the whole check may take
  spend_usd: 0.5        # most one check may spend on models (Claude Code plan use is not counted)
