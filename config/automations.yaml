# =============================================================================
#  Quality-of-life automations (DESIGN.md §13.6).
#  Schema: packages/contracts/src/config.ts → AutomationsFile
#  Cron runs in the server's local time zone. Jobs without cron are
#  event-driven (after a turn, on ingest, and so on).
# =============================================================================
version: 1
# Every key under `config` is a setting Admin → Automations offers, and the
# feature or job reads it (services/core/src/automations/jobs.ts lists them).
# Jobs without cron are event-driven: switched and set in Admin, run by the
# feature they serve.
jobs:
  auto_title:            # name a new thread from its first message
    enabled: true
  auto_tag_sources:      # topic tags on ingest (the knowledge service)
    enabled: true
    config: { max_tags: 5 }
  stale_sources:         # ETag / Last-Modified / content-hash check of web sources
    enabled: true
    cron: "0 4 * * 1"
    config: { url_stale_after_days: 7, force: false }
  draft_autosave:        # the Cockpit keeps every keystroke on the device either way
    enabled: true
    config: { server_every_s: 3 }
  cleanup:               # drop old log lines, spans and run events
    enabled: true
    cron: "0 3 * * *"
  memory_backup:         # push the memory repo; off until it has a remote
    enabled: true
    cron: "0 * * * *"
  tidy_storage:          # backup first, then dedupe chunks and old versions by content hash, then vacuum; only when idle
    enabled: false
    cron: "30 3 * * 0"
  duplicate_sources:     # exact hash and near-duplicate detection, on ingest
    enabled: true
    config: { near_duplicate_percent: 90 }
  branch_suggestions:    # suggest a branch when the topic shifts
    enabled: true
    config: { max_shared_percent: 10 }
  context_overflow_warn: # warn, then compact automatically
    enabled: true
    config: { warn_at_percent: 80, compact_at_percent: 95 }
  memory_capture:        # corrections, failure lessons, findings, model quirks (its mode is Admin → Memory's)
    enabled: true
