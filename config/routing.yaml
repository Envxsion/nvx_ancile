# =============================================================================
#  Task classes → fallback chains (DESIGN.md §7.2).
#  Schema: packages/contracts/src/config.ts → RoutingFile
#  A user's explicit model choice is always the first link; the chain fills
#  in behind it. Disabled or unconfigured models are skipped.
#  A class may also say what it needs with `want` (docs/models.md, Tiers):
#    tier   tiny | small | standard | frontier, the tier to aim at
#    floor  never go below this tier (default: none)
#    distinct_family  generator: prefer a model from another family than the writer
#    needs  vision, tools or json, when the task has to have them
#  The router then picks the best ready model for it in any provider, ordered by
#  tier distance then price, and widens (other family, one tier either way, any
#  ready model) rather than fail. Models in `chain` are tried first.
#  `escalate: true` lets fact-checking step up a tier on doubt (at most twice).
# =============================================================================
version: 1

task_classes:
  # <provider>/<line>:latest means the line's current model (docs/models.md, Lines and tiers).
  chat.default:                     # ordinary chat turns
    - anthropic/sonnet:latest
    - openai/sol:latest
    - controller/qwen3-72b
    - ollama/qwen3-14b
  chat.deep:                        # "think harder" turns and research synthesis
    - anthropic/opus:latest
    - openai/astra:latest
    - anthropic/sonnet:latest
  utility:                          # titles, tags, memory capture, summaries
    chain:
      - anthropic/haiku:latest
      - ollama/qwen3-14b
    want: { tier: small, floor: tiny }   # any provider's small model when those are not ready
  embed:                            # chunk and memory embeddings
    - local/bge-small-en-v1.5
  rerank:                           # cross-encoder reranking of retrieved chunks
    - local/bge-reranker-v2-m3
  factcheck.verify:                 # a second opinion, from another family when one is ready
    prefer_different_family: true
    # Standard tier by default; fact-checking picks tiny for obvious claims and standard or better for
    # numbers, dates, citations and critical notebooks (docs/factcheck.md), and steps up a tier on doubt.
    want: { tier: standard, distinct_family: generator }
    escalate: true

resilience:
  retry:
    base_ms: 250                    # first backoff
    factor: 2                       # exponential growth
    cap_ms: 8000                    # longest single wait
    max_attempts: 4                 # per target, before moving down the chain
  breaker:
    window_s: 60                    # rolling window for the failure rate
    failure_rate: 0.5               # open at this rate…
    min_calls: 8                    # …once the window holds at least this many calls
    consecutive: 5                  # or after this many failures in a row
    half_open_s: 30                 # first probe delay; doubles up to 10 minutes
  compute_wait_max_s: 240           # longest wait for a waking GPU node before falling back
