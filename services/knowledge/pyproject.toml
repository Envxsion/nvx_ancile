[project]
name = "ancile-knowledge"
version = "0.1.0"
description = "NVX Ancile knowledge layer: ingestion, chunking, embeddings, hybrid search, evidence. A product from nvx.sh."
requires-python = ">=3.12,<3.13"
license = { text = "UNLICENSED" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
  "pgvector>=0.3.6",
  "alembic>=1.14",
  "structlog>=24.4",
  "opentelemetry-sdk>=1.28",
  "opentelemetry-instrumentation-fastapi>=0.49b0",
  "httpx>=0.28",
  "datasketch>=1.6",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.2.2",  # .env support for pydantic-settings
  "pypdfium2>=4.30",       # PDF text, page by page
  "readability-lxml>=0.8", # main content of a web page
]

[project.scripts]
ancile-knowledge = "ancile_knowledge.main:run"

[project.optional-dependencies]
# Embeddings and rerank run locally on CPU (ONNX). Kept as an extra so the
# test suite and CI install in seconds; the Docker image always includes it.
embed = ["fastembed>=0.4"]
# Extraction: MarkItDown (MIT) for office documents and HTML.
extract = ["markitdown>=0.1"]
# The boot suite runs inside the production image (DESIGN.md §14).
boot = ["pytest>=8.3", "pytest-asyncio>=0.24"]
# Layout-heavy PDFs: tables, equations. Pulls torch.
docling = ["docling>=2.15"]
# Scanned PDFs and images.
ocr = ["docling[easyocr]>=2.15"]

[dependency-groups]
dev = ["pytest>=9.0.3", "pytest-asyncio>=1.2.0", "pytest-cov>=7.0.0", "ruff>=0.14.13", "mypy>=1.13", "types-requests>=2.32.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ancile_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["boot: fast boot-time checks run before the service accepts traffic (DESIGN.md §14)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP047"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

# Libraries that ship no type information.
[[tool.mypy.overrides]]
module = ["datasketch", "datasketch.*", "pypdfium2", "pypdfium2.*", "readability", "readability.*"]
ignore_missing_imports = true

[tool.uv]
# Security floors carried over from the upstream notebook engine.
constraint-dependencies = [
  "anyio>=4.14.2",
  "pyjwt>=2.15.1",
  "urllib3>=2.8.0",
  "soupsieve>=2.9",
]
